<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Grand Quiz</title>
<meta name="theme-color" content="#16193F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#EEF0FF;--surface:#FFFFFF;--surface2:#E1E4FB;--text:#16193F;--muted:#565A90;
  --gold:#A86F00;--goldbg:#FFEDB5;--line:#C9CDF2;--ok:#1E8A45;--bad:#C4323A;
  --c0:#D93A40;--c1:#2F9443;--c2:#2B67D1;--c3:#DB6A06;--c4:#8A4FD8;--c5:#D6408F;--c6:#A07C00;--c7:#0E8F8F;--onp:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16193F;--surface:#22266A;--surface2:#2C3180;--text:#F3F1FF;--muted:#A9ABD9;
    --gold:#FFC93C;--goldbg:#3A3470;--line:#3A3F92;--ok:#5FD98A;--bad:#FF7A80;
    --c0:#FF5A5F;--c1:#5CD67A;--c2:#5B9BFF;--c3:#FF9A3C;--c4:#B98CFF;--c5:#FF6FB5;--c6:#FFD23F;--c7:#3FD6D0;--onp:#16193F;
  }
}
:root[data-theme="dark"]{
  --bg:#16193F;--surface:#22266A;--surface2:#2C3180;--text:#F3F1FF;--muted:#A9ABD9;
  --gold:#FFC93C;--goldbg:#3A3470;--line:#3A3F92;--ok:#5FD98A;--bad:#FF7A80;
  --c0:#FF5A5F;--c1:#5CD67A;--c2:#5B9BFF;--c3:#FF9A3C;--c4:#B98CFF;--c5:#FF6FB5;--c6:#FFD23F;--c7:#3FD6D0;--onp:#16193F;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:1400px;margin:0 auto;padding:16px clamp(12px,3vw,32px) 24px;display:flex;flex-direction:column;gap:18px;min-height:100%}

header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
h1{font-family:Bungee,Impact,"Arial Black",sans-serif;font-weight:400;font-size:clamp(1.3rem,2.6vw,1.9rem);margin:0;color:var(--gold);letter-spacing:.02em}
nav{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tab{background:transparent;border:2px solid var(--line);border-radius:999px;padding:7px 16px;font-weight:600;color:var(--muted)}
.tab[aria-current="true"]{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.gear{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:7px 14px;font-weight:600}

.stage{background:var(--surface);border-radius:24px;padding:clamp(18px,3.5vw,44px);min-height:clamp(300px,48vh,560px);display:flex;flex-direction:column;gap:18px;position:relative}
.roundtitle{font-family:Bungee,Impact,"Arial Black",sans-serif;font-size:clamp(1rem,1.8vw,1.3rem);color:var(--gold);margin:0}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;color:var(--muted);font-weight:500}
.chip{background:var(--surface2);color:var(--text);border-radius:999px;padding:4px 14px;font-weight:600}
.chip.val{background:var(--gold);color:var(--bg);font-family:Bungee,Impact,sans-serif;font-weight:400}
.question{font-size:clamp(1.45rem,3.3vw,2.7rem);font-weight:600;line-height:1.2;margin:0;max-width:30ch}
.status{min-height:1.6em;font-weight:600;font-size:1.1rem}
.status .who{padding:3px 12px;border-radius:8px;color:var(--onp)}
.answer{border-left:6px solid var(--gold);background:var(--goldbg);border-radius:0 14px 14px 0;padding:14px 20px;font-size:clamp(1.15rem,2.2vw,1.6rem);font-weight:600}
.answer small{display:block;font-size:.95rem;font-weight:400;color:var(--muted);margin-top:4px}
.reveal{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}

.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.facts li{display:flex;gap:16px;align-items:center;background:var(--surface2);border:3px solid transparent;border-radius:16px;padding:14px 18px;font-size:clamp(1.1rem,2.2vw,1.55rem);font-weight:500}
.facts .l{font-family:Bungee,Impact,sans-serif;color:var(--gold);font-size:1.3em;min-width:1.2em}
.facts.quad{display:grid;grid-template-columns:1fr 1fr}
.facts.quad li{font-size:clamp(1rem,1.9vw,1.35rem)}
.facts li.true{border-color:var(--ok)}
.facts li.false{opacity:.5;text-decoration:line-through;text-decoration-thickness:2px}
.facts .tag{margin-left:auto;font-weight:700;font-size:.8em;text-decoration:none}
.facts li.true .tag{color:var(--ok)}

.boardwrap{overflow-x:auto;margin:0 -4px;padding:4px}
.board{display:grid;grid-template-columns:repeat(9,minmax(100px,1fr));gap:8px;min-width:940px}
.board .head{font-weight:700;font-size:.95rem;line-height:1.2;text-align:center;padding:10px 6px;min-height:3.4em;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--surface2)}
.board .head.fav{box-shadow:inset 0 -5px 0 var(--hc)}
.cell{background:var(--bg);border:2px solid var(--line);border-radius:12px;font-family:Bungee,Impact,sans-serif;font-size:clamp(1.4rem,2.6vw,2.2rem);color:var(--gold);padding:12px 0;transition:transform .12s}
.cell:hover{transform:scale(1.04)}
.cell.used{color:var(--muted);opacity:.3}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;max-width:640px}
.rank li{display:flex;align-items:center;gap:16px;background:var(--surface2);border-radius:14px;padding:12px 18px;font-size:clamp(1.1rem,2.2vw,1.5rem);font-weight:600}
.rank .pos{font-family:Bungee,Impact,sans-serif;color:var(--muted);min-width:1.6em}
.rank .bar{width:10px;align-self:stretch;border-radius:4px;background:var(--pc)}
.rank .pts{margin-left:auto;font-family:Bungee,Impact,sans-serif;color:var(--pc)}
.next{margin:0;padding:16px 20px;border-radius:14px;border:2px dashed var(--line);font-size:1.1rem}
.next strong{color:var(--gold)}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;max-width:760px;width:100%;margin:8px auto 0}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.step .who2{font-weight:700;font-size:clamp(1rem,2.2vw,1.5rem);overflow-wrap:anywhere}
.step .pts{font-family:Bungee,Impact,sans-serif;color:var(--pc);font-size:clamp(1.3rem,3vw,2.2rem)}
.step .block{width:100%;border-radius:14px 14px 0 0;background:var(--pc);display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-family:Bungee,Impact,sans-serif;font-size:clamp(1.6rem,4vw,3rem);color:var(--onp)}
.winner{font-family:Bungee,Impact,sans-serif;font-size:clamp(1.6rem,4.5vw,3.4rem);color:var(--gold);margin:0;text-align:center;line-height:1.15}
.winner span{overflow-wrap:anywhere}
#cd{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,12,40,.72);z-index:50;font-family:Bungee,Impact,sans-serif;color:#FFC93C;font-size:clamp(6rem,30vw,22rem);line-height:1;text-align:center}
#cd.on{display:flex}
#cd.go{font-size:clamp(3rem,12vw,9rem)}
.chip.joker{background:var(--ok);color:var(--bg)}
.turnline{margin:0;font-size:clamp(1.1rem,2vw,1.4rem);font-weight:500}
.legend{color:var(--muted);font-size:.95rem;margin:0}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:none;border-radius:12px;padding:12px 20px;font-weight:700;background:var(--surface);border:2px solid var(--line)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.btn.good{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:default}
.spacer{flex:1}

.players{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pod{position:relative;background:var(--surface);border-radius:18px;padding:14px 16px 14px 22px;overflow:hidden;cursor:pointer;border:3px solid transparent;text-align:left;display:flex;flex-direction:column;gap:2px}
.pod::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--pc)}
.pod .name{font-weight:700;font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .key{color:var(--muted);font-size:.85rem}
.pod .score{font-family:Bungee,Impact,sans-serif;font-size:clamp(1.8rem,3.4vw,2.6rem);line-height:1.1;color:var(--pc)}
.pod .adj{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
.pod .adj button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-weight:700;padding:0}
.pod.buzz{background:var(--pc);color:var(--onp);border-color:var(--pc);animation:flash .5s ease-out}
.pod.buzz .score,.pod.buzz .key{color:var(--onp)}
.pod.buzz::before{background:var(--onp);opacity:.35}
.pod.out{opacity:.35}
.pod.right{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok)}
.pod.right .kb{color:var(--ok);font-weight:700}
.pod.turn{border-color:var(--pc);box-shadow:0 0 0 3px var(--pc)}
@keyframes flash{0%{transform:scale(1)}30%{transform:scale(1.06)}100%{transform:scale(1)}}

.link{font-size:.9rem;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.link.on{background:var(--ok);color:var(--bg)}
.peek{border-left-color:var(--muted);background:var(--surface2)}
.peek small{margin:0 0 4px}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.modes .btn[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--bg)}
body.remote .screen-only{display:none!important}
body:not(.remote) .remote-only{display:none!important}
body.remote .stage{min-height:0}
button.link{border:none;cursor:pointer}
.lobbygrid{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin:8px 0 14px}
.qr{background:#fff;border-radius:14px;padding:8px;width:220px;height:220px;display:flex;align-items:center;justify-content:center}
.qr svg{width:100%;height:100%}
.lmuted{color:var(--muted);margin:0 0 4px}
.joinurl{font-weight:600;word-break:break-all;margin:0 0 12px}
.code{font-family:Bungee,Impact,sans-serif;font-size:2.6rem;color:var(--gold);margin:0;letter-spacing:.12em}
.slots{list-style:none;margin:0 0 8px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slots li{display:flex;gap:10px;align-items:center;background:var(--surface2);border-radius:12px;padding:10px 12px}
.slots .st{margin-left:auto;font-size:.9rem;color:var(--muted);text-align:right}
.slots li.on .st{color:var(--ok);font-weight:700}
@media (max-width:600px){.lobbygrid{grid-template-columns:1fr;justify-items:center}.slots{grid-template-columns:1fr}}
body.player .app{display:none}
body.player #phone{display:block}
#phone{max-width:560px;margin:0 auto;padding:16px 16px 28px}
.ptitle{font-family:Bungee,Impact,sans-serif;font-weight:400;color:var(--gold);font-size:1.8rem;margin:8px 0 2px}
.pmuted{color:var(--muted);margin:0 0 18px}
.pstatus{background:var(--surface2);border-radius:12px;padding:10px 14px;font-weight:600;margin:0 0 14px}
.plabel{display:block;font-weight:700;margin:16px 0 8px}
#pname{width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:1.1rem}
.pslots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pslot{border:3px solid var(--pc);background:var(--surface);border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;gap:2px;text-align:left}
.pslot strong{color:var(--pc);font-size:1.15rem}
.pslot span{font-size:.9rem;color:var(--muted)}
.pslot em{font-style:normal;font-size:.85rem;font-weight:600}
.pslot:disabled{opacity:.35;cursor:default}
.phost{width:100%;margin-top:14px}
.phead{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:12px 16px;border-left:10px solid var(--pc);margin-bottom:14px}
.phead .pn{font-weight:700;font-size:1.15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phead .ps{margin-left:auto;font-family:Bungee,Impact,sans-serif;color:var(--pc);font-size:1.4rem}
.phead .pquit{background:none;border:none;color:var(--muted);font-size:.85rem;text-decoration:underline;padding:4px}
.pcard{background:var(--surface);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.pround{font-family:Bungee,Impact,sans-serif;color:var(--gold);margin:0;font-size:1rem}
.pq{font-size:1.3rem;font-weight:600;line-height:1.25;margin:0}
.pinfo{margin:0;font-weight:600;font-size:1.1rem}
.pbuzz{width:min(100%,340px);aspect-ratio:1/1;border-radius:50%;border:none;background:var(--pc);color:var(--onp);font-family:Bungee,Impact,sans-serif;font-size:clamp(2rem,12vw,3.6rem);box-shadow:0 10px 0 rgba(0,0,0,.25);margin:10px auto 0;display:flex;align-items:center;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none;padding:24px;text-align:center}
.pbuzz:active{transform:translateY(6px);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.pbuzz:disabled{opacity:.3;font-family:Rubik,system-ui,sans-serif;font-size:1.2rem;font-weight:700;box-shadow:none}
.pbuzz.mine:disabled{opacity:1;font-size:1.5rem}
.popts{display:flex;flex-direction:column;gap:10px}
.popt{display:flex;gap:12px;align-items:center;text-align:left;border:3px solid var(--line);background:var(--surface2);border-radius:14px;padding:14px;font-size:1.05rem;font-weight:500;touch-action:manipulation}
.popt .l{font-family:Bungee,Impact,sans-serif;color:var(--gold);font-size:1.4rem;min-width:1.2em}
.popt.sel{border-color:var(--gold);background:var(--goldbg)}
.popt.ok{border-color:var(--ok)}
.popt.ko{border-color:var(--bad);opacity:.7}
.popt:disabled{cursor:default}
.ppick{display:flex;flex-direction:column;gap:10px}
.ppick .row{display:flex;flex-direction:column;gap:6px}
.ppick .th{font-weight:700}
.ppick .vals{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ppick .vals button{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 0;font-family:Bungee,Impact,sans-serif;font-size:1.3rem;color:var(--gold)}
.ppick .vals button:disabled{opacity:.2}
.pans{border-left:6px solid var(--gold);background:var(--goldbg);border-radius:0 12px 12px 0;padding:12px 14px;font-weight:600}
dialog{border:none;border-radius:20px;background:var(--surface);color:var(--text);padding:24px;width:min(560px,92vw);max-height:88vh}
dialog::backdrop{background:rgba(10,12,40,.6)}
dialog h2{margin:0 0 4px;font-size:1.3rem}
dialog p{margin:0 0 16px;color:var(--muted)}
.prow{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;margin-bottom:10px}
.dot{width:14px;height:14px;border-radius:50%}
.prow input{width:100%;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.keybtn{padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface2);font-weight:600;white-space:nowrap}
.keybtn.wait{border-color:var(--gold);color:var(--gold)}
.opt{display:flex;gap:10px;align-items:center;margin:8px 0}
.drow{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}

@media (max-width:760px){
  .facts.quad{grid-template-columns:1fr}
  .players{grid-template-columns:repeat(2,1fr)}
  .pod .adj{position:static;margin-top:6px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.lobbymain{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:clamp(16px,3vw,40px);align-items:start}
.qrbox{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.qrbox .qr{width:min(260px,70vw);height:auto;aspect-ratio:1/1;margin-bottom:8px}
.warn{color:var(--bad);font-weight:600;margin:6px 0 0}
.roster{display:flex;flex-direction:column;gap:12px}
.rhead{margin:0;font-weight:700;font-size:1.2rem}
.rlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.rlist li{display:flex;align-items:center;gap:12px;background:var(--surface2);border-radius:14px;padding:10px 12px;animation:pop .3s ease-out}
.rbar{width:10px;align-self:stretch;border-radius:4px;background:var(--pc)}
.rtxt{display:flex;flex-direction:column;min-width:0}
.rtxt strong{font-size:1.1rem;color:var(--pc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtxt small{color:var(--muted)}
.rst{margin-left:auto;font-size:.8rem;color:var(--muted);text-align:right}
.rdel{background:none;border:none;color:var(--muted);font-size:1rem;padding:4px 6px}
.players[hidden],nav[hidden]{display:none!important}
.pcolors{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pcol{display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid transparent;background:var(--surface);border-radius:14px;padding:10px 4px;font-size:.85rem;font-weight:600}
.pcol .sw{width:30px;height:30px;border-radius:50%;background:var(--pc)}
.pcol.sel{border-color:var(--pc)}
.pcol:disabled{opacity:.25}
.pthemes{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:46vh;overflow:auto;padding:2px}
.pth{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;font-weight:600;display:flex;flex-direction:column;gap:2px}
.pth em{font-style:normal;font-weight:400;font-size:.8rem;color:var(--muted)}
.pth.sel{border-color:var(--gold);background:var(--goldbg)}
.pth:disabled{opacity:.35}
.pjoin{width:100%;margin-top:16px;padding:16px}
.dlgform{display:flex;flex-direction:column;gap:10px}
.dlgform input,.dlgform select{padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
#qrDlgBody{display:flex;flex-direction:column;align-items:center;text-align:center}
#qrDlgBody .qr{width:min(260px,70vw);height:auto;aspect-ratio:1/1}
@media (max-width:760px){.lobbymain{grid-template-columns:1fr}}

</style>
</head>
<body>
<div class="app">
  <header>
    <h1 data-title>Le Grand Quiz</h1>
    <nav id="tabs" hidden></nav>
    <span class="spacer"></span>
    <button class="link" id="link" hidden></button>
    <button class="gear" id="openSetup">Réglages</button>
  </header>
  <main class="stage" id="stage" aria-live="polite"></main>
  <div class="controls" id="controls"></div>
  <section class="players" id="players" aria-label="Joueurs" hidden></section>
</div>

<div id="phone" hidden></div>
<div id="cd" aria-live="assertive"></div>

<dialog id="setup">
  <h2>Réglages</h2>
  <label class="opt remote-only"><input type="checkbox" id="peekBox"> Voir les réponses avant de les révéler (si l'animateur ne joue pas)</label>
  <div class="screen-only">
    <h3 style="margin:14px 0 2px;font-size:1.05rem">Quiz</h3>
    <p id="quizInfo"></p>
    <div class="drow" style="margin-top:0">
      <button class="btn" id="loadQuiz">Charger un quiz (.json)</button>
      <button class="btn" id="exportQuiz">Télécharger ce quiz</button>
      <button class="btn" id="copyPrompt">Copier la consigne pour Claude</button>
      <button class="btn" id="siteQuiz">Revenir au quiz du site</button>
    </div>
    <input type="file" id="quizFile" accept=".json,application/json" hidden>
    <h3 style="margin:14px 0 2px;font-size:1.05rem">Joueurs</h3>
    <p>Pour jouer avec des buzzers ou au clavier : cliquez sur une touche, puis appuyez sur le buzzer du joueur.</p>
    <div id="prows"></div>
    <label class="opt"><input type="checkbox" id="neg"> Retirer les points en cas d'erreur (manche 4)</label>
    <label class="opt"><input type="checkbox" id="snd"> Sons</label>
  </div>
  <div class="drow">
    <button class="btn screen-only" id="resetScores">Scores à zéro</button>
    <button class="btn screen-only" id="newGame">Nouvelle partie</button>
    <button class="btn bad screen-only" id="clearRoom">Vider la salle</button>
    <button class="btn remote-only" id="quitRemote">Quitter le mode animateur</button>
    <span class="spacer"></span>
    <button class="btn primary" id="closeSetup">Fermer</button>
  </div>
</dialog>

<dialog id="addLocal">
  <h2>Joueur sans téléphone</h2>
  <p>Il jouera au buzzer, au clavier ou à l'oral, et l'écran principal comptera ses points.</p>
  <div class="dlgform">
    <label for="alName">Prénom</label><input id="alName" maxlength="20">
    <label for="alColor">Couleur</label><select id="alColor"></select>
    <label for="alTheme">Thème</label><select id="alTheme"></select>
  </div>
  <div class="drow"><span class="spacer"></span><button class="btn" id="alCancel">Annuler</button><button class="btn primary" id="alOk">Ajouter</button></div>
</dialog>

<dialog id="qrDlg">
  <h2>Rejoindre la salle</h2>
  <div id="qrDlgBody"></div>
  <div class="drow"><button class="btn" id="newCode">Nouveau code</button><span class="spacer"></span><button class="btn primary" id="qrClose">Fermer</button></div>
</dialog>

  themes.forEach(t=>{ const k = t.name.toLowerCase(); if(seen.has(k)) throw quizError("Le thème « " + t.name + " » apparaît deux fois."); seen.add(k); });
  const cg = q.cultureGenerale ? compileTheme(q.cultureGenerale, "Culture générale", true) : null;
  const title = typeof q.titre==="string" && q.titre.trim() ? q.titre.trim().slice(0,40) : "Le Grand Quiz";
  return {title, themes, cg};
}
function hashStr(t){ let h = 5381; for(let i=0;i<t.length;i++) h = ((h<<5)+h+t.charCodeAt(i))|0; return (h>>>0).toString(36); }
function useQuiz(q){

/* ---------------------- Génération d'une partie ---------------------- */
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
function interleave(queues){
  const qs = queues.map(q=>({ti:q.ti, items:q.items.slice()})).filter(q=>q.items.length);
  const out = []; let last = null;
  while(qs.some(q=>q.items.length)){
    let cand = qs.filter(q=>q.items.length && q.ti!==last);
    if(!cand.length) cand = qs.filter(q=>q.items.length);
    const max = Math.max(...cand.map(q=>q.items.length));
    const top = cand.filter(q=>q.items.length===max);
    const pick = top[Math.floor(Math.random()*top.length)];
    out.push({ti:pick.ti, it:pick.items.shift()}); last = pick.ti;
  }
  return out;
}
function shuffleOpts(it, key){
  const n = it[key].length, perm = shuffle([...Array(n).keys()]);
  return Object.assign({}, it, {[key]:perm.map(i=>it[key][i]), ok:perm.indexOf(it.ok)});
}
function buildGame(){
  const P = S.players.length;
  const chosen = S.players.map(p=>p.theme);
  const bonus = shuffle(QZ.themes.map((_,i)=>i).filter(i=>!chosen.includes(i))).slice(0, Math.max(0, 5-P));
  const A = chosen.concat(bonus);
  const T = ti => ti===-1 ? QZ.cg : QZ.themes[ti];
  const pack = (key, k, target) => {
    const qs = A.map(ti=>({ti, items:shuffle(T(ti)[key]).slice(0,k)}));
    const used = qs.reduce((s,x)=>s+x.items.length, 0);
    if(QZ.cg) qs.push({ti:-1, items:shuffle(QZ.cg[key]).slice(0, Math.max(0, target-used))});
    return interleave(qs);
  };
  const r1 = pack("m1", Math.max(2, Math.ceil(18/A.length)), 36).map(({ti,it})=>({t:T(ti).name, ti, q:it.q, a:it.a}));
  const r2 = pack("m2", A.length<=5 ? 2 : 1, 16).map(({ti,it})=>Object.assign({t:T(ti).name, ti}, shuffleOpts(it, "f")));
  const rp = pack("m3", 1, 12).map(({ti,it})=>Object.assign({t:T(ti).name, ti}, shuffleOpts(it, "o")));
  const r3 = A.map(ti=>({t:T(ti).name, ti, qs:T(ti).m4}));
  if(QZ.cg) r3.push({t:QZ.cg.name, ti:-1, qs:QZ.cg.m4});
  return {r1, r2, rp, r3};
}

/* ---------------------- État ---------------------- */
const fresh = () => ({quizId:"", view:"lobby", r1:0, r2:0, rp:0, turn:0, next:null, cur:null, used:{}, neg:true, snd:true, game:null, players:[]});

/* ---------------------- Sons ---------------------- */
let ac;
function ctx(){ if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac && ac.state==="suspended") ac.resume(); return ac; }
function tone(f, d, type="square", w=0, v=.12){
  if(!S.snd || MODE!=="screen") return; const a = ctx(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + w;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+.03);
}
const sBuzz = i => { const p = PITCH[S.players[i] ? S.players[i].color : 0]; tone(p,.12); tone(p*1.5,.22,"square",.1); };
const sGood = () => { [660,880,1320].forEach((f,k)=>tone(f,.25,"triangle",k*.09,.18)); };
const sBad = () => { tone(140,.45,"sawtooth",0,.14); };
const sSting = () => { [523,659,784,1047].forEach((f,k)=>tone(f,k===3?.5:.18,"triangle",k*.12,.16)); };
const sFanfare = () => { [[392,0,.15],[523,.15,.15],[659,.3,.15],[784,.45,.35],[659,.8,.15],[784,.95,.9]].forEach(([f,w,d])=>{ tone(f,d,"square",w,.1); tone(f/2,d,"triangle",w,.12); }); };

/* ---------------------- Déroulé du jeu ---------------------- */
function startGame(){
  if(S.view!=="lobby" || NP()<MINP || !QZ) return;
  G = buildGame();
  S.players.forEach(p=>{ p.score = 0; p.joker = true; });
  Object.assign(S, {view:"r1", r1:0, r2:0, rp:0, turn:0, next:null, cur:null, used:{}});
  resetQ(); sSting(); sendGameAll(); render();
}
function backToLobby(){
  S.players.forEach(p=>{ p.score = 0; p.joker = true; });
  Object.assign(S, {view:"lobby", r1:0, r2:0, rp:0, turn:0, next:null, cur:null, used:{}});
  G = null; resetQ(); sendGameAll(); render();
}
function buzz(i){
  if(S.view!=="r1" || !validIdx(i) || Q.buzz!==null || Q.revealed || Q.out.includes(i)) return;
  Q.buzz = i; sBuzz(i); render();
}
function good(){
  if(Q.buzz===null || Q.judged || isMulti()) return;
  S.players[Q.buzz].score += pts(); Q.revealed = true; Q.judged = true; sGood();
  if(S.view==="r3q") S.turn = (S.turn+1) % NP();
  render();
}
function bad(){
  if(Q.buzz===null || Q.judged || isMulti()) return;
  if(S.view==="r3q" && S.neg) S.players[Q.buzz].score -= pts();
  sBad();
  if(S.view==="r3q"){ Q.revealed = true; Q.judged = true; S.turn = (S.turn+1) % NP(); render(); return; }
  Q.out.push(Q.buzz); Q.buzz = null;
  if(Q.revealed || Q.out.length>=NP()){ Q.revealed = true; Q.judged = true; }
  render();
}
function okIndex(){ return S.view==="r2" ? G.r2[S.r2].ok : S.view==="rp" ? G.rp[S.rp].ok : -1; }
function reveal(){
  if(!inQuestion() || Q.revealed) return;
  if(isMulti()){ const ok = okIndex(); Q.right = S.players.map((_,i)=>i).filter(i=>Q.ans[i]===ok); }
  Q.revealed = true; if(Q.buzz===null && !isMulti()) Q.judged = true; render();
}
function validate(){
  if(!isMulti() || !Q.revealed || Q.judged) return;
  Q.right.forEach(i=>{ if(S.players[i]) S.players[i].score += pts(); });
  Q.judged = true; if(Q.right.length) sGood(); else sBad(); render();
}
function pod(i){
  if(!validIdx(i)) return;
  if(S.view==="r1"){ buzz(i); return; }
  if(isMulti()){ if(!Q.revealed || Q.judged) return; const k = Q.right.indexOf(i); if(k>-1) Q.right.splice(k,1); else Q.right.push(i); render(); return; }
  if(S.view==="r3q"){ if(!Q.judged && !Q.joker){ Q.buzz = i; render(); } return; }
  if(S.view==="board"){ S.turn = i; render(); }
}
function go(view){ if(!G) return; S.view = view; resetQ(); render(); }
function goInter(next){ S.next = next; S.view = "inter"; resetQ(); sSting(); render(); }
function finish(){ if(!G) return; S.view = "final"; resetQ(); sFanfare(); render(); }
function step(d){
  const k = S.view, list = {r1:G.r1, r2:G.r2, rp:G.rp}[k]; if(!list) return;
  const n = S[k] + d;
  if(n>=list.length){ goInter({r1:"r2", r2:"rp", rp:"board"}[k]); return; }
  if(n<0) return;
  S[k] = n; resetQ(); render();
}
function openCell(c, r){
  if(!G || !G.r3[c] || r<0 || r>4) return;
  S.cur = {c, r}; S.used[c+"-"+r] = true; S.view = "r3q"; resetQ(); Q.buzz = S.turn % NP(); render();
}
function joker(){
  if(S.view!=="r3q" || Q.judged || Q.joker || Q.buzz===null || !S.players[Q.buzz].joker) return;

let cdTimer = null;
function countdown(){
  if(!isMulti() || Q.revealed || cdTimer || MODE!=="screen") return;

const ACTIONS = {
  go: v => { if(["r1","r2","rp","board"].includes(v)) go(v); },
  step: d => { if(d===1 || d===-1) step(d); },
  openCell: (c,r) => { if(Number.isInteger(c) && Number.isInteger(r)) openCell(c,r); },
  buzz: i => { ctx(); buzz(i); },
  pod: i => { ctx(); pod(i); },
  validate: () => validate(), countdown: () => countdown(), joker: () => joker(), finish: () => finish(),
  start: () => { if(["r2","rp","board"].includes(S.next)) go(S.next); },
  startGame: () => startGame(),
  good: () => good(), bad: () => bad(), reveal: () => reveal(),
  adj: (i,d) => { if(validIdx(i) && (d===1 || d===-1)){ S.players[i].score += d; render(); } }
};
function act(a, ...args){
  if(MODE==="remote"){ if(NET.host && REMOTE_OK) sendTo(NET.host, {t:"cmd", a, args, v:VER}); return; }
  if(MODE==="screen" && ACTIONS[a]) ACTIONS[a](...args);
}

const newCode = () => { let c = ""; for(let i=0;i<4;i++) c += ALPH[Math.floor(Math.random()*ALPH.length)]; return c; };
const NET = {peer:null, code:"", ok:false, err:"", conns:new Set(), host:null};
function sendTo(conn, obj){ try{ if(conn && conn.open) conn.send(obj); }catch(e){} }
function sendAll(obj){ if(MODE!=="screen") return; NET.conns.forEach(info=>{ if(info.role) sendTo(info.conn, obj); }); }
function lobbyMsg(){

function computeOnline(){ ONLINE = S.players.map(p=>[...NET.conns].some(x=>x.role==="player" && x.pid===p.id)); }
function snapshot(){
  return {v:VER, Q, online:ONLINE, S:{view:S.view, r1:S.r1, r2:S.r2, rp:S.rp, cur:S.cur, used:S.used, neg:S.neg, turn:S.turn, next:S.next,
    players:S.players.map(p=>({id:p.id, name:p.name, color:p.color, theme:p.theme, score:p.score, key:p.key, joker:p.joker}))}};
}
function broadcast(){
  if(MODE!=="screen") return;
  computeOnline();
  const st = snapshot(), lob = lobbyMsg();
  NET.conns.forEach(info=>{ sendTo(info.conn, lob); if(info.role) sendTo(info.conn, {t:"state", st}); });
}
function sendGameAll(){ NET.conns.forEach(info=>sendTo(info.conn, {t:"game", g:G})); }
function hostStart(code, tries){
  tries = tries || 0;
  if(typeof Peer==="undefined"){ NET.err = "Le module de connexion n'a pas pu se charger."; render(); return; }
  if(NET.peer){ try{ NET.peer.destroy(); }catch(e){} }
  NET.ok = false; NET.code = code; NET.err = "";
  const peer = new Peer(PREFIX + code, {debug:0});
  NET.peer = peer;
  peer.on("open", ()=>{ if(NET.peer!==peer) return; NET.ok = true; NET.err = ""; try{ localStorage.setItem(CODE_KEY, code); }catch(e){} render(); });
  peer.on("connection", conn=>{ if(NET.peer===peer) hostConn(conn); });
  peer.on("disconnected", ()=>{
    if(NET.peer!==peer || peer.destroyed) return;
    NET.ok = false; renderLink();
    setTimeout(()=>{ if(NET.peer===peer && !peer.destroyed && peer.disconnected) peer.reconnect(); }, 2000);
  });
  peer.on("error", err=>{
    if(NET.peer!==peer) return;
    if(err.type==="unavailable-id"){
      NET.err = "Réouverture de la salle " + code + "…"; render();
      try{ peer.destroy(); }catch(e){}
      if(tries<5) setTimeout(()=>hostStart(code, tries+1), 3000); else hostStart(newCode(), 0);
      return;
    }
    if(["network","server-error","socket-error","socket-closed"].includes(err.type)){
      NET.ok = false; NET.err = "Connexion au service perdue, nouvel essai…"; render();
      setTimeout(()=>{ if(NET.peer!==peer) return; if(peer.destroyed) hostStart(code, 0); else if(peer.disconnected) peer.reconnect(); }, 4000);
    }
  });
  render();
}
function hostConn(conn){
  const info = {conn, role:null, pid:""};
  NET.conns.add(info);
  conn.on("open", ()=>{ if(G) sendTo(conn, {t:"game", g:G}); sendTo(conn, lobbyMsg()); });
  conn.on("data", d=>{ try{ onHostData(info, d); }catch(e){} });
  const gone = ()=>{ if(!NET.conns.has(info)) return; NET.conns.delete(info); render(); };
  conn.on("close", gone); conn.on("error", gone);
}
const idxOf = info => info.role==="player" ? S.players.findIndex(p=>p.id===info.pid) : -1;
function onHostData(info, d){
  if(!d || typeof d!=="object") return;
  if(d.t==="hello"){
    info.pid = String(d.pid||"").slice(0,40);
    if(info.pid && S.players.some(p=>p.id===info.pid)){
      NET.conns.forEach(x=>{ if(x!==info && x.role==="player" && x.pid===info.pid){ x.role = null; try{ x.conn.close(); }catch(e){} } });
      info.role = "player"; sendTo(info.conn, {t:"welcome", role:"player"});
    }
    render(); return;
  }
  if(d.t==="join"){
    if(!info.pid || S.players.some(p=>p.id===info.pid)){ if(S.players.some(p=>p.id===info.pid)){ info.role = "player"; sendTo(info.conn, {t:"welcome", role:"player"}); render(); } return; }
    const err = addPlayer(info.pid, d.name, d.color, d.theme);
    if(err){ sendTo(info.conn, {t:"error", msg:err}); sendTo(info.conn, lobbyMsg()); return; }
    info.role = "player"; sendTo(info.conn, {t:"welcome", role:"player"}); render(); return;
  }
  if(d.t==="remote"){ info.role = "remote"; sendTo(info.conn, {t:"welcome", role:"remote"}); render(); return; }
  if(d.t==="leave"){
    const i = idxOf(info);
    if(i>-1 && S.view==="lobby") S.players.splice(i,1);
    info.role = null; sendTo(info.conn, lobbyMsg()); render(); return;
  }
  if(info.role==="remote" && d.t==="cmd"){
    if(d.v!==VER || typeof d.a!=="string" || !Object.prototype.hasOwnProperty.call(ACTIONS, d.a)) return;
    ACTIONS[d.a](...(Array.isArray(d.args) ? d.args.slice(0,2) : []));
    return;
  }
  const i = idxOf(info);
  if(i<0) return;
  if(d.t==="buzz"){ if(S.view==="r1"){ ctx(); buzz(i); } return; }
  if(d.t==="ans"){
    const n = S.view==="r2" ? 3 : S.view==="rp" ? 4 : 0;
    if(!n || Q.revealed || Q.locked || !Number.isInteger(d.k) || d.k<0 || d.k>=n) return;
    Q.ans[i] = d.k; render(); return;
  }
  if(d.t==="pick"){ if(S.view==="board" && S.turn % NP()===i && Number.isInteger(d.c) && Number.isInteger(d.r) && G.r3[d.c] && d.r>=0 && d.r<5 && !S.used[d.c+"-"+d.r]) openCell(d.c, d.r); return; }
  if(d.t==="joker"){ if(S.view==="r3q" && Q.buzz===i) joker(); return; }
}

}

function setClientMode(m){
  MODE = m;

function clientStart(){
  if(typeof Peer==="undefined"){ CLIENT.status = "Impossible de charger le module de connexion. Rechargez la page."; renderPhone(); return; }
  const peer = new Peer({debug:0});
  NET.peer = peer;
  let pending = null;
  const schedule = ms => { if(pending) return; pending = setTimeout(()=>{ pending = null; connect(); }, ms); };
  const connect = ()=>{
    if(peer.destroyed) return;
    if(peer.disconnected){ peer.reconnect(); return; }
    if(NET.host && NET.host.open) return;
    const conn = peer.connect(PREFIX + JOIN, {reliable:true, serialization:"json"});
    let opened = false;
    conn.on("open", ()=>{ opened = true; NET.host = conn; CLIENT.status = ""; sendTo(conn, {t:"hello", pid:PID}); renderPhone(); renderLink(); });
    conn.on("data", d=>{ try{ onClientData(d); }catch(e){} });
    conn.on("close", ()=>{
      if(NET.host===conn) NET.host = null;
      REMOTE_OK = false; SNAP_OK = false;
      CLIENT.status = "Connexion perdue, reconnexion…";
      if(MODE==="remote") setClientMode("remote"); else renderPhone();
      schedule(2000);
    });
    conn.on("error", ()=>{});
    setTimeout(()=>{ if(!opened){ try{ conn.close(); }catch(e){} schedule(500); } }, 8000);
  };
  peer.on("open", connect);
  peer.on("disconnected", ()=>setTimeout(()=>{ if(!peer.destroyed && peer.disconnected) peer.reconnect(); }, 2000));
  peer.on("error", err=>{
    if(err.type==="peer-unavailable"){ CLIENT.status = "Salle " + JOIN + " introuvable pour l'instant. Vérifiez que le quiz est ouvert sur l'écran principal…"; renderPhone(); schedule(3000); return; }
    if(["network","server-error","socket-error","socket-closed"].includes(err.type)){ CLIENT.status = "Connexion au service impossible, nouvel essai…"; renderPhone(); schedule(4000); }
  });
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && !(NET.host && NET.host.open)) schedule(200); });
}
function applySnapshot(st){
  const me = myIdx(), prevBuzz = Q.buzz, prevView = S.view;
  S = Object.assign(fresh(), st.S, {players:(st.S.players||[]).slice(0,MAXP).map(p=>({id:String(p.id||""), name:String(p.name||"").slice(0,24), color:+p.color||0, theme:+p.theme||0, score:+p.score||0, key:String(p.key||""), joker:!!p.joker}))});
  Q = Object.assign(newQ(), st.Q);
  ONLINE = Array.isArray(st.online) ? st.online.map(Boolean) : [];
  VER = st.v;
  const nm = myIdx();
  if(MODE==="player" && nm>-1 && Q.buzz===nm && (prevBuzz!==nm || prevView!==S.view) && navigator.vibrate) navigator.vibrate(200);
}
function onClientData(d){
  if(!d || typeof d!=="object") return;
  if(d.t==="game"){ G = d.g || null; return; }
  if(d.t==="lobby"){
    LOBBY = d;
    if(d.title){ document.title = d.title; document.querySelectorAll("[data-title]").forEach(el=>{ el.textContent = d.title; }); }
    if(d.themes && !QZ) QZ = {title:d.title, themes:d.themes.map(n=>({name:String(n)})), cg:null};
    else if(d.themes && QZ) QZ.themes = d.themes.map(n=>({name:String(n)}));
    if(MODE==="join") renderPhone();
    return;
  }
  if(d.t==="welcome"){ JOIN_ERR = ""; setClientMode(d.role==="remote" ? "remote" : "player"); return; }
  if(d.t==="error"){ JOIN_ERR = String(d.msg||"").slice(0,120); renderPhone(); return; }
  if(d.t==="kicked"){ SNAP_OK = false; JOIN_ERR = "Tu as été retiré de la salle."; setClientMode("join"); return; }
  if(d.t==="state"){
    try{ applySnapshot(d.st); SNAP_OK = true; REMOTE_OK = MODE==="remote"; }catch(e){ return; }
    if(MODE==="player" && myIdx()<0){ SNAP_OK = false; setClientMode("join"); return; }
    if(MODE==="remote"){ renderTabs(); renderStage(); renderControls(); renderPlayers(); renderLink(); } else renderPhone();
    return;
  }
  if(d.t==="cd"){
    const el = $("cd");
    if(d.n===null || d.n===undefined){ el.className = ""; el.textContent = ""; }
    else { el.className = typeof d.n==="number" ? "on" : "on go"; el.textContent = String(d.n).slice(0,20); if(navigator.vibrate && typeof d.n!=="number") navigator.vibrate(120); }
  }
}
function renderPhone(){
  const el = $("phone"); el.hidden = false;
  if(MODE==="join"){ renderJoin(); return; }
  if(MODE!=="player") return;
  const me = myIdx();
  if(!SNAP_OK || me<0){ el.innerHTML = `<div class="pcard"><p class="pinfo">${esc(CLIENT.status || "Connexion…")}</p></div>`; return; }
  const P = S.players[me], col = pc(me);
  let h = `<div class="phead" style="--pc:${col}"><span class="pn" data-n="${me}"></span><span class="ps">${P.score}</span>${S.view==="lobby" ? `<button class="pquit" data-quit>Modifier</button>` : ""}</div>`;
  if(CLIENT.status) h += `<p class="pstatus">${esc(CLIENT.status)}</p>`;
  let body = "";
  if(S.view==="lobby"){
    body = `<p class="pround">Salle d'attente</p><p class="pq">C'est bon, tu es inscrit !</p>
      <p class="pinfo">${esc(COLORS[P.color])}, thème : ${esc(themeName(P.theme))}</p>
      <p class="pmuted" style="margin:0">La partie commence dès que l'écran principal la lance. ${NP()} joueur${NP()>1?"s":""} dans la salle.</p>`;
  } else if(!G){ body = `<p class="pinfo">Chargement de la partie…</p>`; }
  else if(S.view==="r1"){
    const it = G.r1[S.r1];
    let lab = "BUZZ", dis = false, cls = "", other = false;
    if(Q.revealed || Q.judged){ lab = "Question terminée"; dis = true; }
    else if(Q.buzz===me){ lab = "À toi ! Réponds à voix haute"; dis = true; cls = "mine"; }
    else if(Q.buzz!==null){ other = true; dis = true; }
    else if(Q.out.includes(me)){ lab = "Raté, les autres peuvent buzzer"; dis = true; }
    body = `<p class="pround">${ROUNDS[1]}</p><p class="pinfo">${esc(it.t)}</p><p class="pq">${esc(it.q)}</p>
      <button class="pbuzz ${cls}" id="pbuzz" style="--pc:${col}" ${dis?"disabled":""}><span>${other ? `<span data-n="${Q.buzz}"></span> a la main` : esc(lab)}</span></button>
      ${Q.revealed ? `<div class="pans">${esc(it.a)}</div>` : ""}`;
  }
  else if(isMulti()){
    const r2 = S.view==="r2", it = r2 ? G.r2[S.r2] : G.rp[S.rp], opts = r2 ? it.f : it.o, ok = it.ok;
    const my = Q.ans[me], has = hasAns(me), locked = Q.locked || Q.revealed;
    let info = !has ? "Choisis ta réponse" : "Réponse envoyée : " + LET[my] + (locked ? "" : ", tu peux encore changer");
    if(Q.locked && !Q.revealed) info = !has ? "Temps écoulé, pas de réponse" : "Temps écoulé : réponse " + LET[my];
    if(Q.revealed) info = my===ok ? "Bonne réponse ! +2" : "Raté, c'était la " + LET[ok];
    body = `<p class="pround">${ROUNDS[r2?2:3]}</p><p class="pinfo">${esc(it.t)}</p>
      <p class="pq">${r2 ? "Laquelle est vraie ?" : esc(it.q)}</p>
      <div class="popts">${opts.map((f,k)=>`<button class="popt ${my===k?"sel":""} ${Q.revealed&&k===ok?"ok":""} ${Q.revealed&&my===k&&k!==ok?"ko":""}" data-k="${k}" ${locked?"disabled":""}><span class="l">${LET[k]}</span><span>${esc(f)}</span></button>`).join("")}</div>
      <p class="pinfo">${esc(info)}</p>`;
  }
  else if(S.view==="board"){
    if(S.turn % NP()===me){
      body = `<p class="pround">${ROUNDS[4]}</p><p class="pq">À toi de choisir une case</p>
        <div class="ppick">${G.r3.map((c,ci)=>`<div class="row"><span class="th">${esc(c.t)}</span><div class="vals">${[0,1,2,3,4].map(r=>`<button data-pc="${ci}" data-pr="${r}" ${S.used[ci+"-"+r]?"disabled":""}>${r+1}</button>`).join("")}</div></div>`).join("")}</div>`;
    } else body = `<p class="pround">${ROUNDS[4]}</p><p class="pq"><span data-n="${S.turn % NP()}"></span> choisit une case</p>`;
    body += `<p class="pinfo">${P.joker ? "Ton joker est disponible" : "Tu as utilisé ton joker"}</p>`;
  }
  else if(S.view==="r3q"){
    const c = G.r3[S.cur.c], it = c.qs[S.cur.r], v = S.cur.r+1;
    body = `<p class="pround">${ROUNDS[4]}</p><p class="pinfo">${esc(c.t)}, ${v} point${v>1?"s":""}${Q.joker?" × 2 (joker)":""}</p><p class="pq">${esc(it.q)}</p>`;
    if(Q.buzz===me){
      body += `<p class="pinfo">${Q.judged ? "" : "À toi de répondre, à voix haute"}</p>`;
      if(!Q.judged && !Q.joker && P.joker) body += `<button class="btn primary" data-joker>Joker : doubler les points</button>`;
    } else if(Q.buzz!==null) body += `<p class="pinfo"><span data-n="${Q.buzz}"></span> répond</p>`;
    if(Q.revealed) body += `<div class="pans">${esc(it.a)}</div>`;
  }
  else if(S.view==="inter" || S.view==="final"){
    const o = order(), r = rankOf(me), top = S.players[o[0]].score;
    const head = S.view==="final" ? (P.score===top ? "Bravo, tu as gagné !" : `Tu termines ${r===1?"1er":r+"e"}`) : `Tu es ${r===1?"1er":r+"e"} pour l'instant`;
    body = `<p class="pround">${S.view==="final" ? "Résultats" : "Fin de manche"}</p><p class="pq">${head}</p>
      <ol class="rank">${o.map(i=>`<li style="--pc:${pc(i)}"><span class="pos">${rankOf(i)}</span><span class="bar"></span><span data-n="${i}"></span><span class="pts">${S.players[i].score}</span></li>`).join("")}</ol>`;
  }
  h += `<div class="pcard">${body}</div>`;
  el.innerHTML = h;
  fillNames(el);
}
function renderJoin(){
  const el = $("phone");
  if(!$("pname")){
    el.innerHTML = `<h1 class="ptitle" data-title>${esc(document.title)}</h1><p class="pmuted">Salle ${esc(JOIN)}</p>
      <p class="pstatus" id="jstatus" hidden></p>
      <div id="jform">
        <label class="plabel" for="pname">Ton prénom</label><input id="pname" maxlength="20" autocomplete="off" enterkeyhint="done">
        <p class="plabel">Ta couleur</p><div class="pcolors" id="jcolors"></div>
        <p class="plabel">Ton thème</p><div class="pthemes" id="jthemes"></div>
        <p class="pstatus" id="jmsg" hidden></p>
        <button class="btn primary pjoin" id="jgo">Rejoindre la partie</button>
      </div>
      <p class="pinfo" id="jgame" hidden>Une partie est en cours. Si tu jouais déjà sur ce téléphone, tu seras reconnecté automatiquement.</p>
      <button class="btn phost" data-role="remote">Je suis l'animateur (télécommande)</button>`;
    $("pname").value = ME_NAME;
    $("pname").addEventListener("input", e=>{ ME_NAME = e.target.value; });
  }
  const connected = !!(NET.host && NET.host.open);
  const js = $("jstatus"); js.hidden = !CLIENT.status; js.textContent = CLIENT.status;
  const inGame = LOBBY && LOBBY.phase==="game";
  $("jform").hidden = !!inGame; $("jgame").hidden = !inGame;
  const players = LOBBY ? LOBBY.players : [];
  const takenC = new Map(players.map(p=>[p.color, p.name])), takenT = new Map(players.map(p=>[p.theme, p.name]));
  if(SEL.color!==null && takenC.has(SEL.color)) SEL.color = null;
  if(SEL.theme!==null && takenT.has(SEL.theme)) SEL.theme = null;
  $("jcolors").innerHTML = COLORS.map((c,i)=>`<button class="pcol ${SEL.color===i?"sel":""}" data-color="${i}" style="--pc:var(--c${i})" ${takenC.has(i)?"disabled":""} aria-label="${esc(c)}"><span class="sw"></span><span>${esc(c)}</span></button>`).join("");
  const themes = LOBBY ? LOBBY.themes : [];
  $("jthemes").innerHTML = themes.length ? themes.map((t,i)=>`<button class="pth ${SEL.theme===i?"sel":""}" data-theme="${i}" ${takenT.has(i)?"disabled":""}><span>${esc(t)}</span>${takenT.has(i)?`<em data-tk="${i}"></em>`:""}</button>`).join("") : `<p class="pmuted">Chargement des thèmes…</p>`;
  $("jthemes").querySelectorAll("[data-tk]").forEach(x=>{ x.textContent = "Pris par " + (takenT.get(+x.dataset.tk) || "quelqu'un"); });
  const jm = $("jmsg"); jm.hidden = !JOIN_ERR; jm.textContent = JOIN_ERR;
  const full = players.length>=MAXP;
  $("jgo").disabled = !connected || SEL.color===null || SEL.theme===null || full;
  $("jgo").textContent = full ? "La salle est pleine" : SEL.color===null ? "Choisis ta couleur" : SEL.theme===null ? "Choisis ton thème" : "Rejoindre la partie";
  el.querySelector("[data-role]").disabled = !connected;
}
$("phone").addEventListener("pointerdown", e=>{
  const b = e.target.closest("#pbuzz");
  if(b && !b.disabled && NET.host){ e.preventDefault(); sendTo(NET.host, {t:"buzz"}); if(navigator.vibrate) navigator.vibrate(30); }
});
$("phone").addEventListener("click", e=>{
  const t = e.target;
  const c = t.closest("[data-color]"); if(c && !c.disabled){ SEL.color = +c.dataset.color; JOIN_ERR = ""; renderJoin(); return; }
  const th = t.closest("[data-theme]"); if(th && !th.disabled){ SEL.theme = +th.dataset.theme; JOIN_ERR = ""; renderJoin(); return; }
  if(t.closest("#jgo") && !t.closest("#jgo").disabled){
    ME_NAME = ($("pname").value || "").replace(/\s+/g," ").trim().slice(0,20);
    try{ localStorage.setItem("gq-name", ME_NAME); }catch(err){}
    sendTo(NET.host, {t:"join", name:ME_NAME, color:SEL.color, theme:SEL.theme}); return;
  }
  const r = t.closest("[data-role]"); if(r && !r.disabled){ sendTo(NET.host, {t:"remote"}); return; }
  const opt = t.closest("[data-k]");
  if(opt && !opt.disabled && NET.host){ const k = +opt.dataset.k; sendTo(NET.host, {t:"ans", k}); Q.ans[myIdx()] = k; renderPhone(); return; }
  const pk = t.closest("[data-pc]"); if(pk && !pk.disabled && NET.host){ sendTo(NET.host, {t:"pick", c:+pk.dataset.pc, r:+pk.dataset.pr}); return; }
  if(t.closest("[data-joker]") && NET.host){ sendTo(NET.host, {t:"joker"}); return; }
  if(t.closest("[data-quit]")){ sendTo(NET.host, {t:"leave"}); SNAP_OK = false; setClientMode("join"); }
});
$("quitRemote").onclick = ()=>{ if(MODE!=="remote") return; $("setup").close(); sendTo(NET.host, {t:"leave"}); REMOTE_OK = false; setClientMode("join"); };

/* ====================== Chargement du quiz ====================== */
async function fetchJson(u){ const r = await fetch(u, {cache:"no-store"}); if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); }
async function loadInitialQuiz(){
  const p = new URLSearchParams(location.search).get("quiz");
  const tries = [];
  if(p) tries.push(async()=>({q:await fetchJson(p), label:"fichier " + p}));
  tries.push(async()=>{ const t = localStorage.getItem(QUIZ_KEY); if(!t) throw new Error("vide"); return {q:JSON.parse(t), label:"chargé à la main"}; });
  if(location.protocol!=="file:") tries.push(async()=>({q:await fetchJson("quiz.json"), label:"quiz.json du site"}));
  for(const f of tries){
    try{ const r = await f(); compileQuiz(r.q); return r; }
    catch(e){ if(e && e.quiz) QUIZ_WARN = "Un quiz a été ignoré car il contient une erreur : " + e.message; }
  }
  return {q:EXAMPLE_QUIZ, label:"exemple intégré"};
}
function applyHostQuiz(q, label, reset){
  useQuiz(q); QUIZ_SRC = label;
  if(reset || S.quizId!==QUIZ_ID){
    const neg = S.neg, snd = S.snd, keep = reset ? [] : [];
    S = fresh(); S.neg = neg; S.snd = snd; S.quizId = QUIZ_ID; S.players = keep; G = null; resetQ();
    NET.conns.forEach(info=>{ if(info.role==="player"){ sendTo(info.conn, {t:"kicked"}); info.role = null; } });
  }
  render(); renderSetup();
}
$("loadQuiz").onclick = ()=>$("quizFile").click();
$("quizFile").onchange = async e=>{
  const f = e.target.files && e.target.files[0]; e.target.value = "";
  if(!f) return;
  let q;
  try{ q = JSON.parse(await f.text()); compileQuiz(q); }
  catch(err){ alert(err && err.quiz ? "Ce quiz contient une erreur :\n" + err.message : "Ce fichier n'est pas un JSON valide."); return; }
  if(!confirm("Charger « " + (q.titre || f.name) + " » ? La salle et la partie en cours seront remises à zéro.")) return;
  try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(q)); }catch(err){}
  QUIZ_WARN = ""; applyHostQuiz(q, "chargé à la main", true);
};
$("siteQuiz").onclick = async ()=>{
  if(!confirm("Revenir au quiz du site ? La salle et la partie en cours seront remises à zéro.")) return;
  try{ localStorage.removeItem(QUIZ_KEY); }catch(err){}
  QUIZ_WARN = ""; const r = await loadInitialQuiz(); applyHostQuiz(r.q, r.label, true);
};
$("exportQuiz").onclick = ()=>{
  const name = (QZ ? QZ.title : "quiz").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "quiz";
  const url = URL.createObjectURL(new Blob([JSON.stringify(QUIZ, null, 2)], {type:"application/json"}));
  const a = document.createElement("a"); a.href = url; a.download = name + ".json"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
};
$("copyPrompt").onclick = async ()=>{
  try{ await navigator.clipboard.writeText(PROMPT_CLAUDE); alert("Consigne copiée. Colle-la dans Claude avec ta liste de thèmes, puis enregistre la réponse dans un fichier .json."); }
  catch(err){ const t = document.createElement("textarea"); t.value = PROMPT_CLAUDE; document.body.appendChild(t); t.select(); try{ document.execCommand("copy"); alert("Consigne copiée."); }catch(e2){ alert(PROMPT_CLAUDE); } t.remove(); }
};

/* ====================== Démarrage ====================== */
async function init(){
  if(MODE==="join"){ renderPhone(); clientStart(); return; }
  const first = await loadInitialQuiz();
  applyHostQuiz(first.q, first.label, false);
  let code = ""; try{ code = localStorage.getItem(CODE_KEY) || ""; }catch(e){}
  hostStart(/^[A-Z]{4}$/.test(code) ? code : newCode(), 0);
}
init();
